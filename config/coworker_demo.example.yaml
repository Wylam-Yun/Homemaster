schema_version: 1

service:
  bind_host: 127.0.0.1
  port: 8765
  public_base_url: http://127.0.0.1:8765
  startup_timeout_s: 30
  request_timeout_s: 20

paths:
  data_root: data/coworker_demo/case_02
  artifact_root: var/coworker-demo
  service_python: apps/case02_openenv/.venv/bin/python

browser:
  chrome_executable: /usr/bin/google-chrome
  action_timeout_s: 20
  viewport_width: 1280
  viewport_height: 720
  window_x: 640
  window_y: 0

display:
  tigervnc_executable: /usr/bin/Xtigervnc
  xterm_executable: /usr/bin/xterm
  display_min: 120
  display_max: 159
  width: 1920
  height: 1080
  depth: 24
  localhost_only: true

recording:
  enabled: true
  ffmpeg_executable: /usr/bin/ffmpeg
  ffprobe_executable: /usr/bin/ffprobe
  frame_rate: 15
  crf: 20
  preset: veryfast
  first_packet_timeout_s: 15
  final_score_hold_s: 5

terminal:
  tmux_executable: /usr/bin/tmux
  bash_executable: /usr/bin/bash
  bubblewrap_executable: /usr/bin/bwrap
  command_timeout_s: 30

runtime:
  max_tool_iterations: 80
  max_browser_actions: 64
  max_terminal_actions: 4
  max_wall_time_s: 1200
