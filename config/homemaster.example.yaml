providers:
  default: Mimo
  items:
    - name: Mimo
      kind: chat
      api_format: anthropic
      transport: anthropic_sdk
      auth_type: auth_token
      base_url: https://provider.example/anthropic
      model: your-chat-model
      api_keys:
        - "<your-api-key>"
      context_window_tokens: 200000
      max_output_tokens: null

    - name: MemoryEmbedding
      kind: embedding
      api_format: openai
      transport: openai_sdk
      auth_type: api_key
      base_url: https://embedding.example/v1
      model: your-embedding-model
      api_keys:
        - "<your-api-key>"
      embedding_url: https://embedding.example/v1/embeddings
      context_window_tokens: 8192

context:
  auto_compact_enabled: true
  compression_threshold_ratio: 0.5
  output_reserve_tokens: 8192
  token_estimation_padding: 1.3333333333333333
  safety_buffer_tokens: 13000
  protect_first_n: 3
  tail_token_ratio: 0.10
  aggressive_tail_token_ratio: 0.05
  aggressive_protect_first_n: 1
  keep_recent_images: 2
  keep_recent_tool_results_per_type:
    robot_observe: 2
    memory_retriever: 1
    robot_verify: 2
  default_keep_recent_tool_results: 3
  enable_llm_summary: true
  summary_model: null
  abort_on_summary_failure: true
  summary_failure_cooldown_seconds: 60
  reactive_compact_max_retries: 2
  enable_disk_overflow: false
  tool_result_overflow_threshold_chars: 4000

runtime:
  max_tool_iterations: null
  max_consecutive_tool_errors: 5
  max_no_progress_iterations: 20
  max_wall_clock_minutes: null
  runtime_root: /tmp/homemaster/runs
  debug_root: /tmp/homemaster/debug
  results_root: /tmp/homemaster/results

prompts:
  agent_system_prompt: agent_system_prompt
  compact_summary_prompt: compact_summary_prompt
  task_interpreter_prompt: task_interpreter_prompt
  memory_query_prompt: memory_query_prompt
  memory_query_retry: memory_query_retry
  task_summary_prompt: task_summary_prompt

retrieval_scoring:
  metadata_weights:
    target_category_match: 0.2
    target_alias_match: 0.2
    location_match: 0.15
    high_confidence: 0.1
    medium_confidence: 0.05
    stale_penalty: -0.1
  rrf_k: 60
  top_k_limit: 50

grounding:
  room_hints:
    kitchen: ["厨房", "kitchen"]
    living_room: ["客厅", "living room", "living_room"]
    pantry: ["储物间", "pantry"]
    bedroom: ["卧室", "bedroom"]
    study: ["书房", "study"]
    entryway: ["门口", "entryway"]
  anchor_hints:
    table: ["桌", "桌子", "table"]
    cabinet: ["柜", "柜子", "药柜", "橱柜", "cabinet"]
    shelf: ["搁架", "架子", "shelf"]
    counter: ["台面", "柜台", "counter"]
    sofa: ["沙发", "sofa"]
  specific_anchor_words:
    table: ["餐桌", "边桌", "茶几", "书桌", "床头柜", "梳妆台"]
    shelf: ["置物架", "书架"]
    counter: ["操作台"]

provider_client:
  timeout_s: 60.0
  connect_timeout_s: 10.0
  write_timeout_s: 15.0
  pool_timeout_s: 10.0
  max_retries: 2

runtime_paths:
  runtime_root: null
  debug_root: null
  results_root: null
  test_results_root: null
  llm_case_root: null
  memory_case_root: null
  memory_results_root: null

runtime_defaults:
  default_provider_name: Mimo
  default_embedding_provider_name: MemoryEmbedding

memory:
  enabled: true
  dreaming_memory_threshold: 8
  # `scripts/setup_memory_runtime.py setup` writes this portable value and binds
  # the ignored .runtime directory once per server. Do not commit server paths.
  data_root: ../.runtime/memory
  soul_file: SOUL.md
  user_file: USER.md
  memory_file: MEMORY.md
  user_char_limit: 1375
  memory_char_limit: 2200
  embedding_provider_name: MemoryEmbedding
  embedding_dimensions: 4096
  # Use managed_local when HomeMaster should share one private Neo4j process
  # across all HomeMaster instances on the same node. Keep the real password
  # only in the gitignored config/homemaster.yaml (chmod 600).
  neo4j:
    mode: external
    home: ../.runtime/neo4j
    java_home: ../.runtime/java
    uri: bolt://127.0.0.1:7687
    username: neo4j
    password: ""
    database: neo4j
    start_timeout_seconds: 60
    stop_timeout_seconds: 30

observability:
  console_enabled: true
  console_show_thinking: true
  console_thinking_first_line_only: true
  console_verbose_to_expand: true
  default_output_level: medium
  trace_dir: ~/.homemaster/trace
  trace_full_payload: true
  trace_rotation_max_mb: 100
  session_dir: ~/.homemaster/sessions
  save_session_per_iteration: true
  save_on_sigint: true
  strip_images_in_snapshot: true
  interrupt_enabled: true
  interrupt_abort_llm_stream: true
  schema_version: 1

skills:
  user_dirs:
    - ~/.homemaster/skills
  project_dirs:
    - .homemaster/skills
  explicit_dirs: []
  allow_project: true
  # Each plugin root contains OpenHarness plugin directories with plugin.json manifests.
  plugin_roots: []
  enabled_plugins: {}
  # Project .homemaster/plugins Skills are data-only and disabled unless explicitly trusted.
  allow_project_plugin_skills: false
  allowed_builtin_overrides: []

# Optional MCP support requires installing the project with the `mcp` extra.
# Keep real headers and environment values only in ignored config/homemaster.yaml.
mcp:
  servers:
    local_tools:
      transport: stdio
      command: python
      args: ["/absolute/path/to/server.py"]
      env:
        MCP_TOKEN: "<your-mcp-token>"
      cwd: null
      enabled: false
    remote_tools:
      transport: http
      url: https://mcp.example/mcp
      headers:
        Authorization: "Bearer <your-mcp-token>"
      enabled: false
  connect_timeout_s: 15.0
  call_timeout_s: 60.0
  artifact_root: ~/.homemaster/artifacts/tool-output
  artifact_quota_bytes: 67108864
  artifact_ttl_seconds: 604800
  preview_chars: 4000

# Permission mode never grants a capability. The Feishu Gateway deliberately maps every
# non-bot sender to its built-in trusted owner principal.
permissions:
  mode: full_auto
  allowed_tools: []
  denied_tools: []
  path_rules: []
  # Example:
  # path_rules:
  #   - pattern: "/approved/workspace/**"
  #     allow: true
  #   - pattern: "/restricted/**"
  #     allow: false
  denied_commands:
    - "rm -rf *"

# Optional Feishu/Lark WebSocket Gateway requires installing the `gateway` extra.
# Put real credentials only in the ignored mode-0600 config/homemaster.yaml.
gateway:
  enabled: false
  bus_capacity: 128
  per_tenant_capacity: 64
  per_session_capacity: 32
  shutdown_deadline_s: 5.0
  feishu:
    enabled: false
    # app_id: cli_replace_with_app_id
    # app_secret: replace_with_app_secret
    app_id_env: HOMEMASTER_FEISHU_APP_ID
    app_secret_env: HOMEMASTER_FEISHU_APP_SECRET
    encrypt_key_env: HOMEMASTER_FEISHU_ENCRYPT_KEY
    verification_token_env: HOMEMASTER_FEISHU_VERIFICATION_TOKEN
    tenant_id: local
    domain: feishu
    react_emoji: EYES
    attachment_root: ~/.homemaster/attachments/feishu

# Optional fixed-episode ALFWorld mode for `homemaster --gateway --alfworld`.
# These are placeholders only; put real paths in ignored config/homemaster.yaml.
alfworld_gateway:
  asset_root: /replace/with/alfworld-assets
  data_root: /replace/with/alfworld-data
  config_path: /replace/with/alfworld/configs/base_config.yaml
  python_executable: /replace/with/hm_alfworld/bin/python
  env_type: AlfredThorEnv
  split: valid_unseen
  trial_manifest: /replace/with/one-entry-or-reviewed-manifest.json
  trial_index: 0
  seed: 42
  display: ":102"
  manage_xvfb: false
  xvfb_executable: /usr/bin/Xvfb
  startup_timeout_s: 180
  request_timeout_s: 120
  # true preserves V1.8 offscreen object point navigation. Set false for
  # memory-search experiments: offscreen receptacles remain navigable, while
  # other offscreen objects fail before any THOR action.
  allow_offscreen_object_navigation: true

# Optional Ant Design Pro Mock UI mode for `homemaster --gateway --browser`.
browser_gateway:
  start_url: http://127.0.0.1:8000/dashboard/automation
  allowed_origins:
    - http://127.0.0.1:8000
  headless: true
  action_timeout_ms: 10000
  navigation_timeout_ms: 20000
  wait_timeout_ms: 10000

# Trusted local Python extensions are disabled unless every approval field is pinned.
extensions:
  approvals: []
  # - manifest_path: ./extensions/example/manifest.json
  #   extension_id: example.audit
  #   version: 1.0.0
  #   expected_sha256: <64-lowercase-hex-host-computed-digest>
  #   granted_capabilities: [hook.lifecycle]
  #   enabled_tool_ids: []  # deployment registration approval, not a per-run filter
