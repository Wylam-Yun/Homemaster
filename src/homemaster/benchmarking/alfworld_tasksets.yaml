run:
  run_id: null
  trace_root: ./var/alfworld-trace
  provider_config: config/homemaster.yaml
  provider_name: Mimo
  seed: 42
  max_env_steps: 50
  max_invalid_actions: 100
  max_tool_iterations: 1000
  failure_simulation:
    enabled: false
    grasp_failure_rate: 0.0
    put_failure_rate: 0.0
    navigate_failure_rate: 0.0
  long_horizon:
    keep_scene_across_subtasks: true
tasksets:
- id: easy_living_room_219
  floorplan: 219
  difficulty: easy
  description: 客厅日常：找遥控器/手机给老人、收手表、摆枕头、收钥匙
  subtasks:
  - goal_type: look_at_obj_in_light
    object: RemoteControl
    toggle: FloorLamp
    instruction: 把遥控器拿到落地灯下看看是不是老人要的那个
  - goal_type: look_at_obj_in_light
    object: CellPhone
    toggle: FloorLamp
    instruction: 把手机拿到落地灯下看看有没有未读消息
  - goal_type: pick_and_place_simple
    object: Watch
    parent: Safe
    instruction: 把手表收进保险箱
  - goal_type: pick_two_obj_and_place
    object: Pillow
    parent: Sofa
    instruction: 把两个枕头摆到沙发上给老人靠着
  - goal_type: pick_two_obj_and_place
    object: KeyChain
    parent: Safe
    instruction: 把钥匙串收进保险箱
