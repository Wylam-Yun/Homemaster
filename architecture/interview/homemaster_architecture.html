<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HomeMaster · Agent 系统架构图</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --ink:#1c2434; --ink2:#4a5568; --ink3:#7a8699;
    --line:#d8dde6; --accent:#2f5fd0; --accent-soft:#e8effc;
    --c-control:#34517e; --c-data:#2b7fc4; --c-state:#8b5cf6; --c-memory:#0d9488;
    --c-approval:#d97706; --c-observe:#94a3b8; --c-extern:#a5b0bf;
    --shadow:0 1px 3px rgba(20,30,55,.10),0 4px 14px rgba(20,30,55,.06);
    --mono:"SF Mono",Menlo,Consolas,"Courier New",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Segoe UI","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden;
  }
  /* ---------- header ---------- */
  header{
    flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:10px 18px;
    background:var(--panel);border-bottom:1px solid var(--line);z-index:30;
  }
  .logo{font-size:17px;font-weight:800;letter-spacing:.3px}
  .logo em{font-style:normal;color:var(--accent)}
  .subtitle{font-size:12px;color:var(--ink3);margin-top:1px}
  nav.modes{display:flex;gap:6px;margin-left:18px}
  .modes button{
    border:1px solid var(--line);background:#f8fafc;color:var(--ink2);font-size:13px;
    padding:6px 14px;border-radius:8px;cursor:pointer;font-weight:600;transition:.15s;
  }
  .modes button:hover{border-color:var(--accent);color:var(--accent)}
  .modes button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .head-right{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink3)}
  /* ---------- layout ---------- */
  main{flex:1;display:flex;min-height:0}
  #canvasWrap{flex:1;position:relative;overflow:hidden;background:
    radial-gradient(circle at 30% 20%,#fbfcfe 0%,var(--bg) 60%)}
  svg{width:100%;height:100%;display:block;cursor:grab}
  svg.dragging{cursor:grabbing}
  aside{
    flex:0 0 372px;border-left:1px solid var(--line);background:var(--panel);
    display:flex;flex-direction:column;min-height:0;
  }
  /* ---------- side panel ---------- */
  .tabs{display:flex;gap:4px;padding:10px 12px 0;border-bottom:1px solid var(--line)}
  .tabs button{
    flex:1;border:none;background:none;font-size:12.5px;font-weight:700;color:var(--ink3);
    padding:8px 4px;cursor:pointer;border-bottom:2px solid transparent;
  }
  .tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
  #panelBody{flex:1;overflow-y:auto;padding:14px 16px;font-size:13px;line-height:1.62}
  #panelBody h3{font-size:16px;margin:2px 0 2px}
  #panelBody h4{font-size:12px;color:var(--ink3);text-transform:uppercase;letter-spacing:.6px;margin:14px 0 5px}
  .en{font-family:var(--mono);font-size:12.5px;color:var(--accent);word-break:break-all}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;padding:1.5px 7px;border-radius:99px;margin:2px 4px 2px 0}
  .tag.layer{background:var(--accent-soft);color:var(--accent)}
  .tag.warn{background:#fdf0dd;color:#b45309}
  .tag.ok{background:#e6f6f3;color:#0f766e}
  .files li{font-family:var(--mono);font-size:11.5px;color:var(--ink2);margin:3px 0;list-style:none;word-break:break-all}
  .files li::before{content:"› ";color:var(--accent)}
  ul.plain{padding-left:18px}
  ul.plain li{margin:3px 0}
  .muted{color:var(--ink3)}
  .gloss dt{font-weight:700;margin-top:10px}
  .gloss dt span{font-family:var(--mono);font-weight:600;color:var(--accent);font-size:12px}
  .gloss dd{margin:2px 0 4px 0;color:var(--ink2)}
  .card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;background:#fbfcfe}
  .card h5{font-size:13.5px;margin-bottom:4px}
  .card .num{display:inline-block;background:var(--accent);color:#fff;font-size:11px;font-weight:800;
    width:20px;height:20px;border-radius:6px;text-align:center;line-height:20px;margin-right:7px}
  .bd li{margin:6px 0 6px 2px;list-style:none;padding-left:14px;position:relative}
  .bd li::before{content:"—";position:absolute;left:0;color:#c0392b}
  .bd code{font-family:var(--mono);font-size:11px;background:#f1f4f9;padding:0 4px;border-radius:4px}
  .jumplink{display:inline-block;margin-top:10px;padding:7px 14px;border-radius:8px;background:var(--accent);color:#fff;font-size:12.5px;font-weight:700;cursor:pointer;text-decoration:none}
  /* ---------- toolbar overlays ---------- */
  .chips{position:absolute;top:12px;left:14px;display:flex;flex-wrap:wrap;gap:6px;z-index:10;max-width:76%}
  .chip{
    border:1px solid var(--line);background:rgba(255,255,255,.94);color:var(--ink2);
    font-size:12px;padding:5px 11px;border-radius:99px;cursor:pointer;font-weight:600;
    box-shadow:var(--shadow);transition:.15s;
  }
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .chip.hint{cursor:default;color:var(--ink3);box-shadow:none;background:rgba(255,255,255,.8)}
  .legend{
    position:absolute;left:14px;bottom:12px;z-index:10;background:rgba(255,255,255,.95);
    border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:11px;color:var(--ink2);
    box-shadow:var(--shadow);display:flex;gap:14px;align-items:center;flex-wrap:wrap;max-width:76%;
  }
  .legend .li{display:flex;align-items:center;gap:5px}
  .legend svg{display:block}
  .zoomctl{position:absolute;right:14px;top:12px;z-index:10;display:flex;gap:5px}
  .zoomctl button{
    width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:8px;
    font-size:15px;cursor:pointer;color:var(--ink2);box-shadow:var(--shadow);
  }
  .zoomctl button:hover{color:var(--accent);border-color:var(--accent)}
  /* ---------- tour bar ---------- */
  #tourBar{
    position:absolute;left:50%;transform:translateX(-50%);bottom:12px;z-index:12;
    width:min(880px,88%);background:rgba(255,255,255,.97);border:1px solid var(--line);
    border-radius:12px;box-shadow:0 6px 24px rgba(20,30,55,.14);padding:10px 14px;display:none;
  }
  #tourBar.show{display:block}
  .tour-top{display:flex;align-items:center;gap:10px}
  .tour-top .stepno{font-family:var(--mono);font-size:11px;color:var(--ink3)}
  .tour-top .stitle{font-size:13.5px;font-weight:700;flex:1}
  .tour-btns{display:flex;gap:6px}
  .tour-btns button{
    border:1px solid var(--line);background:#fff;border-radius:7px;font-size:12px;
    padding:4px 12px;cursor:pointer;font-weight:600;color:var(--ink2);
  }
  .tour-btns button:hover{color:var(--accent);border-color:var(--accent)}
  .tour-script{font-size:12.5px;color:var(--ink2);margin-top:6px;line-height:1.6}
  .tour-script code{font-family:var(--mono);font-size:11px;background:#f1f4f9;padding:0 3px;border-radius:3px}
  /* ---------- svg elements ---------- */
  .band{fill:#eceff4;stroke:#d4dae4;stroke-width:1;rx:10}
  .bandLbl{font-size:11.5px;font-weight:800;fill:#8a94a6;letter-spacing:1.6px}
  .bandSub{font-size:9.5px;fill:#a5adbb;letter-spacing:.4px}
  .railbox{fill:#f3f6f9;stroke:#ccd4de;stroke-dasharray:5 4;rx:10}
  .seclbl{font-size:12px;font-weight:800;fill:#96a0b1;letter-spacing:2.4px}
  .secsub{font-size:9.5px;fill:#aab2c0;letter-spacing:.4px}
  .node{cursor:pointer}
  .node rect{fill:#fff;stroke:#c6cedb;stroke-width:1.2;filter:drop-shadow(0 1px 2px rgba(20,30,55,.08))}
  .node .bar{fill:var(--accent)}
  .node text{pointer-events:none}
  .node .nCn{font-size:15px;font-weight:800;fill:var(--ink)}
  .node .nCnS{font-size:12.5px;font-weight:800;fill:var(--ink)}
  .node .nEn{font-size:10px;font-weight:600;fill:var(--accent);font-family:var(--mono)}
  .node .nRole{font-size:10px;fill:var(--ink3)}
  .node .nFull{font-size:11.5px;font-weight:800;fill:var(--ink)}
  .node .nFullCn{font-size:10px;fill:var(--ink3)}
  .node:hover rect{stroke:var(--accent);stroke-width:1.8}
  .node.sel rect{stroke:var(--accent);stroke-width:2.2;filter:drop-shadow(0 3px 8px rgba(47,95,208,.25))}
  .node.plane rect{fill:#fbfdff;stroke:#b9c5d6}
  .node.iochip rect{fill:#f0f4fa;stroke:#9fb0c8;stroke-dasharray:4 3;filter:none}
  .node.navchip rect{fill:#fff8ec;stroke:#d9a45b;stroke-dasharray:4 3;filter:none}
  .badge{font-size:8.5px;font-weight:800}
  .edge{fill:none;stroke-width:1.6;opacity:.9;stroke-linejoin:round;stroke-linecap:round}
  .edge.control{stroke:var(--c-control);stroke-width:2}
  .edge.data{stroke:var(--c-data);stroke-dasharray:6 4}
  .edge.state{stroke:var(--c-state);stroke-dasharray:2 3}
  .edge.memory{stroke:var(--c-memory)}
  .edge.approval{stroke:var(--c-approval);stroke-dasharray:9 3 2 3;opacity:.6}
  .edge.approval.on{opacity:1}
  .edge.observe{stroke:var(--c-observe);stroke-width:1.2;opacity:.65}
  .edge.extern{stroke:var(--c-extern);stroke-dasharray:3 3;stroke-width:1.1;opacity:.55}
  .elabel{font-size:10px;fill:#4c5866;paint-order:stroke;stroke:#f5f6f8;stroke-width:4px;display:none}
  .elabel.on{display:block}
  .elabel.always{display:block}
  .node.dim,.edge.dim,.elabel.dim,.band.dim,.deco.dim{opacity:.07;transition:opacity .25s}
  .lit{opacity:1;transition:opacity .25s}
  .edge.on{stroke-width:3;opacity:1}
  .node.litn rect{stroke-width:2.2;filter:drop-shadow(0 2px 7px rgba(20,30,55,.2))}
  .stepnum{font-size:10px;font-weight:800;fill:#fff}
  .stepcirc{fill:var(--accent)}
  ::-webkit-scrollbar{width:9px}
  ::-webkit-scrollbar-thumb{background:#cbd3df;border-radius:6px}
</style>
</head>
<body>
<header>
  <div>
    <div class="logo">HomeMaster <em>· Agent 系统架构图</em></div>
    <div class="subtitle">LLM-first 通用 Agent 运行时 · 单一 ApplicationRuntime · vendored AgentScope ReAct · 源码级调研（file:line 可追溯）</div>
  </div>
  <nav class="modes">
    <button data-mode="l1" class="on">总体架构</button>
    <button data-mode="sub">核心子系统</button>
    <button data-mode="full">完整架构图</button>
    <button data-mode="tour">讲解模式</button>
    <button data-mode="cards">亮点与边界</button>
  </nav>
  <div class="head-right"><span id="stat"></span></div>
</header>
<main>
  <div id="canvasWrap">
    <svg id="svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid meet">
      <defs>
        <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#7b8794"></path>
        </marker>
      </defs>
      <g id="world"></g>
    </svg>
    <div class="chips" id="chips"></div>
    <div class="zoomctl">
      <button id="zin" title="放大">+</button><button id="zout" title="缩小">−</button><button id="zfit" title="复位">⤢</button>
    </div>
    <div class="legend" id="legend"></div>
    <div id="tourBar">
      <div class="tour-top">
        <span class="stepno" id="tNo"></span><span class="stitle" id="tTitle"></span>
        <div class="tour-btns">
          <button id="tPrev">← 上一步</button><button id="tNext">下一步 →</button><button id="tAuto">▶ 自动</button>
        </div>
      </div>
      <div class="tour-script" id="tScript"></div>
    </div>
  </div>
  <aside>
    <div class="tabs">
      <button class="on" data-tab="detail">模块详情</button>
      <button data-tab="gloss">术语表</button>
      <button data-tab="cards">亮点/边界</button>
    </div>
    <div id="panelBody"></div>
  </aside>
</main>
<script>
"use strict";
/* =====================================================================
   数据模型：三级信息层级
   L1 = 总览（主链路 5 节点 + 4 支撑面）   L2 = 6 个子系统展开
   L3 = 完整 46 节点图 + 详情面板 file:line
   ===================================================================== */
const EDGE_TYPES={
 control:{name:"控制流（主调用）",color:"#34517e",dash:""},
 data:{name:"数据/反馈流",color:"#2b7fc4",dash:"6 4"},
 state:{name:"状态流",color:"#8b5cf6",dash:"2 3"},
 memory:{name:"记忆流",color:"#0d9488",dash:""},
 approval:{name:"审批流",color:"#d97706",dash:"9 3 2 3"},
 observe:{name:"事件/观测",color:"#94a3b8",dash:""},
 extern:{name:"外部调用",color:"#a5b0bf",dash:"3 3"},
};
/* ============================ L1 总览 ============================ */
const L1={
 vw:1600,vh:800,
 decor:[
  {t:"txt",x:60,y:250,cls:"seclbl",s:"主执行链路 · MAIN FLOW"},
  {t:"txt",x:60,y:266,cls:"secsub",s:"用户任务 → 五环节 → 环境执行 → 观察回流 · 点击模块进入子系统"},
  {t:"txt",x:382,y:528,cls:"seclbl",s:"横向支撑能力 · CROSS-CUTTING PLANES"},
 ],
 nodes:[
 {id:"entry",x:60,y:300,w:230,h:120,kind:"big",cn:"任务入口",en:"Entry Adapters",role:"5 类入口 → 统一 RunRequest",
  desc:"CLI / Interactive Shell、Web Console(FastAPI+React)、Feishu Gateway、ALFWorld Benchmark、Browser —— 全部入口只做适配：把外部输入翻译成不可变 RunRequest，不持有任何运行时。",
  io:"in: 用户指令/事件 → out: RunRequest",files:["cli/app.py","web/serve.py","channels/impl/feishu.py","alfworld/benchmark/runner.py","browser/application.py"],
  rel:[],value:"五个入口零份重复的运行时——任何渠道 bug 修一次，全渠道受益。"},
 {id:"apprt",x:382,y:300,w:230,h:120,kind:"big",cn:"应用运行时",en:"ApplicationRuntime + Session",role:"唯一Runtime·会话生命周期·代际栅栏",sub:"harness",
  desc:"全系统唯一的应用级生命周期 owner：run() 准入→open_or_resume→turn(generation+1)→RunDriver→commit_and_save；cancel=generation 自增。",
  io:"in: RunRequest → out: RunResult",files:["application/runtime.py:167,268-345","application/session.py:98-216","application/composition/base.py"],
  rel:["driver","sessmgr","sessfs"],value:"入口差异在它之下完全消失。"},
 {id:"engine",x:704,y:300,w:230,h:120,kind:"big",cn:"Agent 决策引擎",en:"AsAgentRuntime ⊃ ReAct",role:"决策循环·权威留在 HM",sub:"harness",
  desc:"HM 语义外壳包裹 vendored AgentScope ReAct 循环：AS 原生 context mutator/injection/ASK 全关，deadline/取消/迭代守卫/上下文/权限权威全在 HM。",
  io:"in: 装配好的 run → out: tool_call / final reply",files:["substrate/runtime.py:127-446,909-945","src/agentscope/agent/_agent.py"],
  rel:["asagent","mw","toolsexec"],value:"借引擎不借语义——引擎可替换，宿主语义不变。"},
 {id:"toolgate",x:1026,y:300,w:230,h:120,kind:"big",cn:"统一工具门",en:"ToolExecutor",role:"唯一路径·权限·租约·结果分类",sub:"tools",
  desc:"所有工具调用（通用/领域/MCP/扩展）过同一条链：参数校验→evaluate_tool→physical 分支/资源租约→wait_for(deadline)→异常与终态分类→artifact 发布。",
  io:"in: ToolExecutionContext → out: ToolExecutionResult",files:["application/tool_executor.py:26-335","tools/executor.py:223-1171"],
  rel:["perm","devices","registry"],value:"没有第二条工具路径——治理点只有一个。"},
 {id:"env",x:1348,y:300,w:230,h:120,kind:"big",cn:"执行环境",en:"Domain Adapters",role:"三类环境注入·权威终态",sub:"env",
  desc:"三种环境=三个 profile 注入同一 Runtime：HomeWorld 文件型模拟、ALFWorld Harness(grounding/oracle)、Browser run 级 Playwright；MCP 为外部工具源。外部世界的回执是唯一权威终态。",
  io:"in: 授权后动作 → out: 环境回执/终态",files:["domain/","alfworld/","browser/","mcp/","adapters/profiles.py"],
  rel:["workercli","alfworker"],value:"模型口头声明不算数——只认环境 won/done。"},
 {id:"state",x:382,y:560,w:230,h:96,kind:"plane",cn:"状态与持久化",en:"Session State Plane",role:"gen栅栏·CAS快照·断点恢复",sub:"state",
  desc:"generation 计数器做全量写屏障；revisions/NNNN.json+latest.json CAS 是唯一 resume 源，session.json 仅观测旁路。",
  io:"in: turn/agent_state → out: 磁盘快照",files:["application/session.py:219-276","substrate/snapshot.py"],rel:["sessmgr","sessfs"],value:"取消不污染会话。"},
 {id:"memory",x:704,y:560,w:230,h:96,kind:"plane",cn:"记忆系统",en:"Memory Plane",role:"召回注入 · 证据门写 · 读回终态",sub:"memory",
  desc:"三层存储（文件/MindMemOS/后台队列）；召回 gen 门控只注一次；写路径全过证据门+读回验证。",
  io:"in: query/写请求 → out: <memory-context>/已验证写入",files:["memory/","application/memory_recall.py","experience/finalizer.py"],rel:["mem_mm","recall","mem_queue"],value:"receipt≠终态。"},
 {id:"perm",x:1026,y:560,w:230,h:96,kind:"plane",cn:"权限风控",en:"Permission & HITL",role:"即时判定 · 物理精确审批 · 设备租约",sub:"perm",
  desc:"普通工具即时判定；物理工具走 SQLite 审批状态机+三通道人审+binding signature 复查；设备租约串行化外部副作用。",
  io:"in: tool+args+subject → out: grant/deny",files:["permissions/policy.py","permissions/store.py","devices/"],rel:["permstore","devices"],value:"交互成本只花在真副作用上。"},
 {id:"events",x:1348,y:560,w:230,h:96,kind:"plane",cn:"事件与观测",en:"Event Plane",role:"Bus→投影→JSONL",sub:"events",
  desc:"有界 RuntimeEvent 总线是系统唯一事件脊柱；三级投影是信任边界（allowlist+generation 固化+opaque ref）；JSONL sink 纯旁路。",
  io:"in: RuntimeEvent → out: DTO/envelope/JSONL",files:["events/bus.py","events/public_projection.py","events/sinks.py"],rel:["ev_bus","ev_proj","ev_sink"],value:"对外零泄漏。"},
 ],
 edges:[
 {f:"entry",t:"apprt",k:"control",l:"统一为 RunRequest",la:true},
 {f:"apprt",t:"engine",k:"control",l:"RunDriver 装配本轮",la:true},
 {f:"engine",t:"toolgate",k:"control",l:"tool_call",la:true},
 {f:"toolgate",t:"env",k:"control",l:"授权后执行",la:true},
 {f:"env",t:"engine",k:"data",l:"观察/回执 → 下一轮决策",arc:190,la:true},
 {f:"engine",t:"entry",k:"data",l:"最终回答 + 事件流",arc:140,la:true},
 {f:"apprt",t:"state",k:"state",l:"快照·代际·commit",la:true},
 {f:"memory",t:"engine",k:"memory",l:"召回注入(gen 门控)",la:true,dx:-40},
 {f:"engine",t:"memory",k:"memory",l:"运行中写·收尾固化",la:true,dx:40},
 {f:"toolgate",t:"perm",k:"approval",l:"评估·审批·租约",la:true},
 {f:"engine",t:"events",k:"observe",l:"emit 结构化事件",route:"bwrap"},
 {f:"env",t:"events",k:"observe",l:"回执/终态",la:true},
 ],
};
/* ============================ L2 子系统 ============================ */
const SUBS={
harness:{
 name:"Harness · Agent Runtime",
 tag:"运行时如何组织和驱动 Agent",
 ioIn:"RunRequest",ioOut:"tool_call → 工具门",
 intro:"每次 run 由 <b>RunDriver</b> 现装配依赖（工具视图/provider/工作副本/deadline），<b>AsAgentRuntime</b> 把 HM 的权威注入 vendored ReAct 循环——AS 原生 context mutator/injection/ASK 全部显式关闭，max_iters 仅 +2 缓冲。<b>借引擎的循环，不借引擎的语义。</b>",
 nodes:[

     const b2=anchor(t,a2.x===t.x+t.w/2?"t":"l");
     if(a2.x===s.x){const my2=(a2.y+b2.y)/2;return`M${a2.x},${a2.y} L${a2.x},${my2} L${b2.x},${my2} L${b2.x},${b2.y}`;}
     const mx2=(a2.x+b2.x)/2;return`M${a2.x},${a2.y} L${mx2},${a2.y} L${mx2},${b2.y} L${b2.x},${b2.y}`;}
   const a2=anchor(s,"b"),b2=anchor(t,"t");
   if(Math.abs(a2.x-b2.x)<10)return`M${a2.x},${a2.y} L${b2.x},${b2.y}`;
   const mx=(a.x+b.x)/2;return`M${a.x},${a.y} L${mx},${a.y} L${mx},${b.y} L${b.x},${b.y}`;}
 const scx=s.x+s.w/2,scy=s.y+s.h/2,tcx=t.x+t.w/2,tcy=t.y+t.h/2;
 const dy=tcy-scy,dx=tcx-scx;
 if(Math.abs(dy)>Math.abs(dx)){
   const a=anchor(s,dy>0?"b":"t",e.dx),b=anchor(t,dy>0?"t":"b",e.dx);const my=(a.y+b.y)/2;
   if(Math.abs(a.x-b.x)<8)return`M${a.x},${a.y} L${b.x},${b.y}`;
   return`M${a.x},${a.y} C${a.x},${my} ${b.x},${my} ${b.x},${b.y}`;}
 const a=anchor(s,dx>0?"r":"l"),b=anchor(t,dx>0?"l":"r");
 if(Math.abs(a.y-b.y)<8)return`M${a.x},${a.y} L${b.x},${b.y}`;
 const mx=(a.x+b.x)/2;
 return`M${a.x},${a.y} C${mx},${a.y} ${mx},${b.y} ${b.x},${b.y}`;
}
function labelPos(e){

const lg=document.getElementById("legend");
lg.innerHTML=Object.entries(EDGE_TYPES).map(([k,v])=>
 `<span class="li"><svg width="30" height="8"><line x1="0" y1="4" x2="30" y2="4" stroke="${v.color}" stroke-width="2" ${v.dash?`stroke-dasharray="${v.dash}"`:""}/></svg>${v.name}</span>`).join("");
/* --- pan/zoom --- */
let drag=null;
svg.addEventListener("mousedown",e=>{drag={x:e.clientX,y:e.clientY,vx:VB.x,vy:VB.y};svg.classList.add("dragging");});
window.addEventListener("mousemove",e=>{if(!drag)return;const r=svg.getBoundingClientRect();
 VB.x=drag.vx-(e.clientX-drag.x)*VB.w/r.width;VB.y=drag.vy-(e.clientY-drag.y)*VB.h/r.height;applyVB();});
window.addEventListener("mouseup",()=>{drag=null;svg.classList.remove("dragging");});
svg.addEventListener("wheel",e=>{e.preventDefault();zoom(e.deltaY>0?1.12:0.89,e.clientX,e.clientY);},{passive:false});
document.getElementById("zin").onclick=()=>zoom(0.8);
document.getElementById("zout").onclick=()=>zoom(1.25);
document.getElementById("zfit").onclick=()=>fitAll();
svg.addEventListener("click",()=>{document.querySelectorAll(".node.sel").forEach(e=>e.classList.remove("sel"));});
window.setMode=setMode;
/* --- hash 深链 --- */
function applyHash(){
 const h=(location.hash||"").replace(/^#\/?/,"");
 if(!h){setMode("l1");return;}
 const[m,arg]=h.split("/");
 if(m==="sub")setMode("sub",arg&&SUBS[arg]?arg:"harness");
 else if(m==="full"){
   const[a,b]=(arg||"").split("-");
   setMode("full");
   if(a==="c"&&CHAINS.some(c=>c.id===b)){state.chain=b;applyFull();renderChips();}
   else if(a==="d"){setStep(Math.max(0,Math.min(14,parseInt(b)||0)));document.getElementById("tourBar").classList.add("show");}
 }
 else if(m==="tour")setMode("tour",arg?Math.max(0,Math.min(TOUR.length-1,parseInt(arg)||0)):0);
 else if(m==="cards")setMode("cards");
 else setMode("l1");
}
window.addEventListener("hashchange",applyHash);
document.getElementById("stat").textContent=`3 级视图 · 46 模块 · 源码级调研`;
renderView("l1");
panel.innerHTML=l1Intro();
renderChips();
if(location.hash)applyHash();
</script>
</body>
