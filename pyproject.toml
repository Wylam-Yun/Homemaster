[project]
name = "homemaster"
version = "0.1.0"
description = "LLM-first generic agent runtime with home-robot domain tools"
requires-python = ">=3.11,<3.14"
dependencies = [
  "aiokafka>=0.14.0",
  "anthropic>=0.40,<1.0",
  "bm25s>=0.2",
  "croniter>=2.0.0",
  "fastapi>=0.136.1",
  "httpx>=0.28.1",
  "jieba>=0.42.1",
  "jsonschema>=4.23,<5",
  "litellm>=1.85.0",
  "neo4j>=6.2.0",
  "numpy>=2.3.5",
  "omegaconf",
  "openai>=1.90,<3.0",
  "opentelemetry-api>=1.42.0",
  "opentelemetry-exporter-otlp-proto-http>=1.42.0",
  "opentelemetry-sdk>=1.42.0",
  "pillow>=10,<13",
  "posthog>=7.14.0",
  "protobuf>=5.29.6,<7.0.0",
  "pydantic>=2.7",
  "python-dotenv>=1.2.2",
  "pytz>=2024.1",
  "qdrant-client==1.18.0",
  "pyyaml>=6.0",
  "rich>=13.7",
  "fastembed==0.8.0",
  "spacy==3.8.14",
  "sqlalchemy>=2.0.31",
  "structlog>=25.5.0",
  "typer>=0.12",
  "traced>=0.1.5",
  "uvicorn>=0.47.0",
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<10",
  "pytest-asyncio>=0.23,<2",
  "ruff>=0.6,<1.0",
]
coworker = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "jinja2>=3.1,<4.0",
  "playwright>=1.45,<2.0",
  "pydantic>=2.7,<3.0",
  "pyyaml>=6,<7",
  "uvicorn>=0.30,<1.0",
]
alfworld = [
  "pyyaml>=6.0",
]
mcp = [
    "mcp>=1.0,<2",
]
gateway = [
  "lark-oapi>=1.7.1,<2",
]

[project.scripts]
homemaster = "homemaster.cli.app:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "third_party/mem0ai-2.0.13", "third_party/MindMemOS/src/mindmemos"]
include = ["homemaster*", "mem0*", "mindmemos*"]

[tool.setuptools]
license-files = ["THIRD_PARTY_NOTICES.md", "third_party/mem0ai-2.0.13/LICENSE"]

[tool.setuptools.package-data]
homemaster = [
  "tools/*.json",
  "prompts/*.md",
  "prompts/*.txt",
  "memory/*.json",
  "memory/bm25_artifact/*",
  "benchmarking/coworker_demo/skills/*/SKILL.md",
  "benchmarking/alfworld/*.json",
  "skills/builtin/*/SKILL.md",
  "skills/builtin/*/**/*",
  "skills/bundled/content/*.md",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = [".", "src", "apps/case02_openenv/src"]
testpaths = ["tests"]
markers = [
  "live_api: runs tests that call real external APIs",
  "live_alfworld: runs tests that require an installed ALFWorld dataset/environment",
  "live_mcp: runs tests that require live MCP servers or transports",
  "live_coworker: runs tests that require the live Coworker browser environment",
  "stress: runs extended concurrency, backpressure, and leak tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["third_party/mem0ai-2.0.13/mem0", "third_party/MindMemOS"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Test files — E402 from sys.path manipulation in test fixtures
"tests/**" = ["E402"]
# Scripts — standalone demo/dev tools, not part of the package
"scripts/**" = ["E402", "E501", "E741", "F841"]
