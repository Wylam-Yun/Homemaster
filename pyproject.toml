[project]
name = "homemaster"
version = "0.1.0"
description = "LLM-first HomeMaster task pipeline"
requires-python = ">=3.11"
dependencies = [
  "bm25s>=0.2",
  "httpx>=0.27",
  "jieba>=0.42",
  "pydantic>=2.7",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
]

[project.scripts]
homemaster = "homemaster.cli.app:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
homemaster = ["prompts/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "live_api: runs tests that call real external APIs",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Legacy shim files — star-imports for backward compat (shims are currently clean;
# these ignores document the intentional pattern and prevent future violations)
"src/homemaster/doctor.py" = ["F401", "F403"]
"src/homemaster/frontdoor.py" = ["F401", "F403"]
"src/homemaster/interactive_shell.py" = ["F401", "F403"]
"src/homemaster/orchestrator.py" = ["F401", "F403"]
"src/homemaster/pipeline_core.py" = ["F401", "F403"]
"src/homemaster/pipeline_stages.py" = ["F401", "F403"]
"src/homemaster/recovery.py" = ["F401", "F403"]
"src/homemaster/stage_04.py" = ["F401", "F403"]
"src/homemaster/stage_05.py" = ["F401", "F403"]
"src/homemaster/stage_06.py" = ["F401", "F403"]
"src/homemaster/skill_selector.py" = ["F401", "F403"]
"src/homemaster/summary.py" = ["F401", "F403"]
"src/homemaster/verifier.py" = ["F401", "F403"]
# Test files — E402 from sys.path manipulation in test fixtures
"tests/**" = ["E402"]
# Scripts — standalone demo/dev tools, not part of the package
"scripts/**" = ["E402", "E501", "E741", "F841"]
