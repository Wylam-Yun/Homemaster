[project]
name = "homemaster"
version = "0.1.0"
description = "LLM-first generic agent runtime with home-robot domain tools"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40,<1.0",
  "bm25s>=0.2",
  "httpx>=0.27",
  "jieba>=0.42",
  "openai>=1.50,<3.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
]
alfworld = [
  "pyyaml>=6.0",
]

[project.scripts]
homemaster = "homemaster.cli.app:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
homemaster = ["prompts/*.md", "prompts/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "live_api: runs tests that call real external APIs",
  "live_alfworld: runs tests that require an installed ALFWorld dataset/environment",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Test files — E402 from sys.path manipulation in test fixtures
"tests/**" = ["E402"]
# Scripts — standalone demo/dev tools, not part of the package
"scripts/**" = ["E402", "E501", "E741", "F841"]
