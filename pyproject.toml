[project]
name = "homemaster"
version = "3.2.0"
description = "LLM-first generic agent runtime with home-robot domain tools"
requires-python = ">=3.11,<3.14"
dependencies = [
  "anthropic>=0.40,<1.0",
  "croniter>=2.0.0",
  "fastapi>=0.136.1",
  "httpx>=0.28.1",
  "jsonschema>=4.23,<5",
  "numpy>=2.3.5",
  "openai>=1.90,<3.0",
  "opentelemetry-api>=1.42.0",
  "opentelemetry-exporter-otlp-proto-http>=1.42.0",
  "opentelemetry-sdk>=1.42.0",
  "pillow>=10,<13",
  "prompt_toolkit>=3.0",
  "protobuf>=5.29.6,<7.0.0",
  "pydantic>=2.7",
  "python-dotenv>=1.2.2",
  "pytz>=2024.1",
  "pyyaml>=6.0",
  "rich>=13.7",
  "sqlalchemy>=2.0.31",
  "structlog>=25.5.0",
  "typer>=0.12",
  "uvicorn>=0.47.0",
  # vendored agentscope (src/agentscope/) core import closure —
  # upstream core deps not already covered above
  "aiofiles",
  "aioitertools",
  "dashscope",
  "docstring_parser",
  "filetype",
  "jinja2",
  "json5",
  "json_repair[schema]>=0.63.4",
  "mcp>=1.0,<2",
  "ollama>=0.5.4",
  "opentelemetry-semantic-conventions>=0.60b0",
  "pypdf",
  "python-datauri",
  "python-frontmatter",
  "requests>=2.32",
  "shortuuid",
  "tree_sitter",
  "tree_sitter_bash",
  "typing-extensions>=4.10",
  "tzdata",
]

[project.optional-dependencies]
# Full memory tier (memory.mode=full): vendored mindmemos' external deps.
# mindmemos itself ships inside the wheel (see packages.find) and is provided
# in dev via [dependency-groups]; it must NOT appear in Requires-Dist.
memory = [
  "aiokafka>=0.14.0",
  "jieba>=0.42.1",
  "litellm>=1.85.0",
  "neo4j>=6.2.0",
  "omegaconf",
  "qdrant-client==1.18.0",
  "spacy==3.8.14",
  "traced>=0.1.5",
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]
dev = [
  "pytest>=8.2,<10",
  "pytest-asyncio>=0.23,<2",
  "ruff>=0.6,<1.0",
]
browser = [
  "playwright>=1.45,<2.0",
]
gateway = [
  "lark-oapi>=1.7.1,<2",
]

[project.scripts]
homemaster = "homemaster.cli.app:app"

# Dev-only dependency group: vendored MindMemOS is needed in the dev
# environment (uv sync installs the dev group by default) but must never
# enter wheel Requires-Dist — the package itself is bundled via
# packages.find below.
[dependency-groups]
dev = ["mindmemos"]

[tool.uv.sources]
mindmemos = { path = "third_party/MindMemOS/src/mindmemos" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta:__legacy__"

[tool.setuptools.packages.find]
where = ["src", "third_party/MindMemOS/src/mindmemos"]
include = ["homemaster*", "mindmemos*", "agentscope*"]
# NOTE: homemaster.cli.benchmark_alfworld is a module inside the cli package, so
# it ships in the wheel regardless (packages.find only matches packages). Its
# benchmark command lazily fails when workers/ is absent from the install —
# that is expected for wheel consumers.

[tool.setuptools]
license-files = ["THIRD_PARTY_NOTICES.md"]

[tool.setuptools.package-data]
homemaster = [
  "tools/*.json",
  "prompts/*.md",
  "prompts/*.txt",
  "resources/*.json",
  "resources/*.yaml",
  "memory/*.json",
  "alfworld/*.md",
  "alfworld/*.yaml",
  "alfworld/*.json",
  "permissions/*.yaml",
  "skills/builtin/*/SKILL.md",
  "skills/builtin/*/**/*",
  "skills/bundled/content/*.md",
  "web/static_dist/**/*",
  "browser/vendor/opencli_1_8_7/LICENSE",
  "browser/vendor/opencli_1_8_7/UPSTREAM.md",
  "browser/vendor/opencli_1_8_7/PATCHES.md",
  "browser/vendor/opencli_1_8_7/SHA256SUMS",
  "browser/vendor/opencli_1_8_7/package.json",
  "browser/vendor/opencli_1_8_7/dist/src/**/*.js",
  "browser/vendor/opencli_1_8_7/dist/src/**/*.d.ts",
  "browser/vendor/opencli_1_8_7/dist/src/**/*.test.js",
  "browser/vendor/opencli_1_8_7/dist/src/**/*.fixture.*",
  "browser/vendor/opencli_1_8_7/dist/src/browser/__fixtures__/**/*",
  "browser/generated/opencli_1_8_7/*",
]
agentscope = [
  "LICENSE",
  "VENDORED_SOURCE.md",
]
# Vendored agentscope package-data (mirrors upstream patterns; "*" applies to
# every discovered package so the data-only _models/_cosyvoice_models/
# _audio_models subdirs with no __init__.py are shipped).
"*" = [
  "py.typed",
  "_models/*.yaml",
  "_cosyvoice_models/*.yaml",
  "_audio_models/*.yaml",
]
"agentscope.workspace._docker" = ["Dockerfile*.template"]
"agentscope.app.storage._sql" = [
  "_alembic/alembic.ini",
  "_alembic/script.py.mako",
  "_alembic/env.py",
  "_alembic/versions/*.py",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = [".", "src"]
testpaths = ["tests"]
# Live-marked tests call real external APIs/services (they gate on local
# config credentials, then spend real money / depend on account state).
# They are opt-in: `pytest -m live_api` still selects them because a
# command-line -m overrides this addopts -m.
addopts = ["-m", "not live_api and not live_memory and not live_alfworld"]
markers = [
  "live_api: runs tests that call real external APIs",
  "live_alfworld: runs tests that require an installed ALFWorld dataset/environment",
  "live_memory: runs tests that require live memory services (Neo4j/Qdrant/MindMemOS)",
  "stress: runs extended concurrency, backpressure, and leak tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["third_party/MindMemOS", "src/agentscope"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Test files — E402 from sys.path manipulation in test fixtures
"tests/**" = ["E402"]
# Scripts — standalone demo/dev tools, not part of the package
"scripts/**" = ["E402", "E501", "E741", "F841"]
# Browser schemas preserve locked provider descriptions; session embeds page-side JavaScript.
"src/homemaster/browser/playwright_session.py" = ["E501"]
"src/homemaster/tools/browser/**" = ["E501"]
