schema_version: browser-change-ticket-trajectory-v1
ticket_source: ../../coworker_demo/case_02/test_set/item_change_ticket.json
ticket_source_sha256: e76b2d5f7ee4b574e629129c32b140cdc784bea1eb1ebf99c0ecf1d78e0f49bb
external_execution_status:
  normal_implementation: VERIFIED
  full_normal: UNVERIFIED
  post_change_anomaly_rollback: UNVERIFIED
ticket_step_coverage:
  check_before_change:
    mock-01-001: [PRE_ALARM, PRE_PROBE, PRE_CAPACITY, PRE_RUNTIME, PRE_TRAFFIC]
    mock-01-004: [PRE_CONFIG, PRE_UPSTREAM]
  change_implement:
    mock-02-001: [ADD_FIELDS, ADD_SUBMIT, ADD_WAIT, ADD_GREP]
  change_verified:
    mock-03-001: [POST_ALARM, POST_PROBE, POST_CAPACITY, POST_RUNTIME, POST_TRAFFIC, ANOMALY_FOUND]
    mock-03-002: [BUSINESS_FIELDS, BUSINESS_SUBMIT, BUSINESS_WAIT]
  change_rollback:
    mock-04-001: [REMOVE_FIELDS, REMOVE_SUBMIT, REMOVE_WAIT, ROLLBACK_GREP]
framework_nodes:
  - SKILL_LOADED
  - TICKET_READ
  - PLAN_CREATED
  - PRE_PROGRESS
  - IMPLEMENT_PROGRESS
  - NORMAL_PROGRESS
  - NORMAL_COMPLETE
  - ROLLBACK_PLANNED
  - ROLLBACK_COMPLETE
scenarios:
  normal: {required_node_count: 26}
  post_change_anomaly: {required_node_count: 23}
review_policy:
  description: Every important step must reach terminal readback, backfill its screenshot, confirm the backfill, and expose both review images.
  required_evidence:
    - terminal_readback
    - observe_media
    - browser_backfill_receipt
    - backfill_confirmed
    - backfill_review_media
safety_rules:
  - {rule_id: ticket_is_sop_source, description: Business steps and values come from the ticket, not the Skill or prompt.}
  - {rule_id: latest_element_refs, description: Every element action resolves the latest snapshot and semantic target receipt.}
  - {rule_id: no_remove_in_normal, description: Normal runs never execute remove or absence verification.}
  - {rule_id: rollback_on_ticket_trigger, description: Rollback only follows a ticket-defined trigger and locked rollback plan.}
nodes:
  - node_id: SKILL_LOADED
    tool_name: load_skill
    argument_predicates: {name: change-ticket-executor}
    required_evidence: [skill_content_loaded]
    preconditions: []
    required_in_scenarios: [normal, post_change_anomaly]
  - node_id: TICKET_READ
    tool_name: web_fetch
    argument_predicates: {url_from_feishu_text: true, exact_text_preserved: true}
    required_evidence: [ticket_content, ticket_content_digest]
    preconditions: [SKILL_LOADED]
    required_in_scenarios: [normal, post_change_anomaly]
  - node_id: PLAN_CREATED
    tool_name: task_planner
    argument_predicates: {ticket_derived: true, targets_locked: true, includes_rollback_branch: true}
    required_evidence: [task_snapshot_changed, locked_ticket_plan]
    preconditions: [TICKET_READ]
    required_in_scenarios: [normal, post_change_anomaly]
  - node_id: PRE_ALARM
    tool_name: browser_click
    argument_predicates: {receipt_target_name: 告警, stage: pre_change}
    required_evidence: [terminal_readback, observe_media, browser_backfill_receipt, backfill_confirmed, backfill_review_media, no_active_alarm]
    preconditions: [PLAN_CREATED]
    required_in_scenarios: [normal, post_change_anomaly]
    review_step: true
  - node_id: PRE_PROBE
    tool_name: browser_click
    argument_predicates: {receipt_target_name: 拨测, stage: pre_change}
    required_evidence: [terminal_readback, observe_media, browser_backfill_receipt, backfill_confirmed, backfill_review_media, probe_normal]
    preconditions: [PLAN_CREATED]
    required_in_scenarios: [normal, post_change_anomaly]
    review_step: true
  - node_id: PRE_CAPACITY
    tool_name: browser_click
    argument_predicates: {receipt_target_name: 容量, stage: pre_change}
    required_evidence: [terminal_readback, observe_media, browser_backfill_receipt, backfill_confirmed, backfill_review_media, capacity_sufficient]
    preconditions: [PLAN_CREATED]
    required_in_scenarios: [normal, post_change_anomaly]
    review_step: true
  - node_id: PRE_RUNTIME
    tool_name: browser_click
    argument_predicates: {receipt_target_name: 核心组件运行指标, stage: pre_change}
    required_evidence: [terminal_readback, observe_media, browser_backfill_receipt, backfill_confirmed, backfill_review_media, runtime_normal]
    preconditions: [PLAN_CREATED]
    required_in_scenarios: [normal, post_change_anomaly]
    review_step: true
  - node_id: PRE_TRAFFIC
    tool_name: browser_click
    argument_predicates: {receipt_target_name: 流量, stage: pre_change}
    required_evidence: [terminal_readback, observe_media, browser_backfill_receipt, backfill_confirmed, backfill_review_media, traffic_normal]
    preconditions: [PLAN_CREATED]
    required_in_scenarios: [normal, post_change_anomaly]
    review_step: true
  - node_id: PRE_CONFIG
    tool_name: browser_inspect
    argument_predicates: {semantic_check: ticket_extension_configuration}
    required_evidence: [terminal_readback, observe_media, browser_backfill_receipt, backfill_confirmed, backfill_review_media, locked_variables_confirmed]
    preconditions: [TICKET_READ]
    required_in_scenarios: [normal, post_change_anomaly]
    review_step: true
  - node_id: PRE_UPSTREAM
    tool_name: browser_inspect
    argument_predicates: {semantic_check: ticket_upstream_readiness}
    required_evidence: [terminal_readback, observe_media, browser_backfill_receipt, backfill_confirmed, backfill_review_media, upstream_ready]
    preconditions: [TICKET_READ]
    required_in_scenarios: [normal, post_change_anomaly]
    review_step: true
  - node_id: PRE_PROGRESS
    tool_name: task_progress_check
    argument_predicates: {milestone: precheck_completed}
    required_evidence: [task_snapshot_changed, all_precheck_evidence]
    preconditions: [PRE_ALARM, PRE_PROBE, PRE_CAPACITY, PRE_RUNTIME, PRE_TRAFFIC, PRE_CONFIG, PRE_UPSTREAM]
    required_in_scenarios: [normal, post_change_anomaly]
  - node_id: ADD_FIELDS
    tool_name: browser_fill
    match_policy: all_variants
    argument_predicates:
      variants:
        - {accessible_name: TenantId, value: tenanttenanttenant000198}
        - {accessible_name: ItemCode, value: read}
        - {accessible_name: SpecCode, value: ext.read.type1}
        - {accessible_name: ExtensionName, value: read-ext}
    required_evidence: [terminal_readback, observe_media, browser_backfill_receipt, backfill_confirmed, backfill_review_media, per_target_dom_readback]
    preconditions: [PRE_PROGRESS]
    required_in_scenarios: [normal, post_change_anomaly]
    review_step: true
  - node_id: ADD_SUBMIT
    tool_name: browser_click
    argument_predicates: {receipt_target_name: 确认执行, operation_from_ticket: add}
    required_evidence: [terminal_readback, observe_media, browser_backfill_receipt, backfill_confirmed, backfill_review_media, accepted_mock_job, command_preview_readback]
    preconditions: [ADD_FIELDS]
    required_in_scenarios: [normal, post_change_anomaly]
    review_step: true
  - node_id: ADD_WAIT
    tool_name: browser_wait
    argument_predicates: {condition_kind: text_present, terminal_status: SUCCESS, exit_code: 0}
    required_evidence: [terminal_readback, observe_media, browser_backfill_receipt, backfill_confirmed, backfill_review_media, mock_return_code]
    preconditions: [ADD_SUBMIT]
    required_in_scenarios: [normal, post_change_anomaly]
    review_step: true
  - node_id: ADD_GREP
    tool_name: bash
    argument_predicates: {command_from_ticket: true, expected_exit_code: 0, expected_state: present}
    required_evidence: [terminal_readback, observe_media, browser_backfill_receipt, backfill_confirmed, backfill_review_media, process_return_code, independent_config_readback]
    preconditions: [ADD_WAIT]
    required_in_scenarios: [normal, post_change_anomaly]
    review_step: true
  - node_id: IMPLEMENT_PROGRESS
    tool_name: task_progress_check
    argument_predicates: {milestone: implementation_completed}
    required_evidence: [task_snapshot_changed, add_and_grep_evidence]
    preconditions: [ADD_GREP]
    required_in_scenarios: [normal, post_change_anomaly]
  - node_id: POST_ALARM
    tool_name: browser_click
    argument_predicates: {receipt_target_name: 告警, stage: post_change, alarm_active: false}
    required_evidence: [terminal_readback, observe_media, browser_backfill_receipt, backfill_confirmed, backfill_review_media, no_active_alarm]
    preconditions: [IMPLEMENT_PROGRESS]
    required_in_scenarios: [normal]
    review_step: true
  - node_id: POST_PROBE
    tool_name: browser_click
    argument_predicates: {receipt_target_name: 拨测, stage: post_change}
    required_evidence: [terminal_readback, observe_media, browser_backfill_receipt, backfill_confirmed, backfill_review_media, probe_normal]
    preconditions: [IMPLEMENT_PROGRESS]
    required_in_scenarios: [normal]
    review_step: true
  - node_id: POST_CAPACITY
    tool_name: browser_click
    argument_predicates: {receipt_target_name: 容量, stage: post_change}
    required_evidence: [terminal_readback, observe_media, browser_backfill_receipt, backfill_confirmed, backfill_review_media, capacity_sufficient]
    preconditions: [IMPLEMENT_PROGRESS]
    required_in_scenarios: [normal]
    review_step: true
  - node_id: POST_RUNTIME
    tool_name: browser_click
    argument_predicates: {receipt_target_name: 核心组件运行指标, stage: post_change}
    required_evidence: [terminal_readback, observe_media, browser_backfill_receipt, backfill_confirmed, backfill_review_media, runtime_normal]
    preconditions: [IMPLEMENT_PROGRESS]
    required_in_scenarios: [normal]
    review_step: true
  - node_id: POST_TRAFFIC
    tool_name: browser_click
    argument_predicates: {receipt_target_name: 流量, stage: post_change}
    required_evidence: [terminal_readback, observe_media, browser_backfill_receipt, backfill_confirmed, backfill_review_media, traffic_normal]
    preconditions: [IMPLEMENT_PROGRESS]
    required_in_scenarios: [normal]
    review_step: true
  - node_id: BUSINESS_FIELDS
    tool_name: browser_fill
    match_policy: all_variants
    argument_predicates:
      variants:
        - {accessible_name: resource-bucket, value_source: runtime_current_user_resource_bucket}
        - {accessible_name: biz_timestamp, value_source: previous_hour_utc_yyyymmddhh}
    required_evidence: [terminal_readback, observe_media, browser_backfill_receipt, backfill_confirmed, backfill_review_media, per_target_dom_readback]
    preconditions: [IMPLEMENT_PROGRESS]
    required_in_scenarios: [normal]
    review_step: true
  - node_id: BUSINESS_SUBMIT
    tool_name: browser_click
    argument_predicates: {receipt_target_name: 确认执行, operation_from_ticket: business_verify}
    required_evidence: [terminal_readback, observe_media, browser_backfill_receipt, backfill_confirmed, backfill_review_media, accepted_mock_job, command_preview_readback]
    preconditions: [BUSINESS_FIELDS]
    required_in_scenarios: [normal]
    review_step: true
  - node_id: BUSINESS_WAIT
    tool_name: browser_wait
    argument_predicates: {condition_kind: text_present, terminal_status: SUCCESS, exit_code: 0}
    required_evidence: [terminal_readback, observe_media, browser_backfill_receipt, backfill_confirmed, backfill_review_media, mock_return_code, business_record]
    preconditions: [BUSINESS_SUBMIT]
    required_in_scenarios: [normal]
    review_step: true
  - node_id: NORMAL_PROGRESS
    tool_name: task_progress_check
    argument_predicates: {milestone: postcheck_completed}
    required_evidence: [task_snapshot_changed, all_postcheck_evidence, business_evidence]
    preconditions: [POST_ALARM, POST_PROBE, POST_CAPACITY, POST_RUNTIME, POST_TRAFFIC, BUSINESS_WAIT]
    required_in_scenarios: [normal]
  - node_id: NORMAL_COMPLETE
    tool_name: browser_click
    argument_predicates: {receipt_target_name: 确认回填, final_state: completed}
    required_evidence: [terminal_readback, observe_media, browser_backfill_receipt, backfill_confirmed, backfill_review_media, final_success_state]
    preconditions: [NORMAL_PROGRESS]
    required_in_scenarios: [normal]
    review_step: true
  - node_id: ANOMALY_FOUND
    tool_name: browser_click
    argument_predicates: {receipt_target_name: 告警, stage: post_change, alarm_active: true}
    required_evidence: [terminal_readback, observe_media, browser_backfill_receipt, backfill_confirmed, backfill_review_media, causal_alarm]
    preconditions: [IMPLEMENT_PROGRESS]
    required_in_scenarios: [post_change_anomaly]
    review_step: true
  - node_id: ROLLBACK_PLANNED
    tool_name: task_progress_check
    argument_predicates: {milestone: rollback_started, trigger_from_ticket: true}
    required_evidence: [task_snapshot_changed, anomaly_evidence, locked_rollback_plan]
    preconditions: [ANOMALY_FOUND]
    required_in_scenarios: [post_change_anomaly]
  - node_id: REMOVE_FIELDS
    tool_name: browser_fill
    match_policy: all_variants
    argument_predicates:
      variants:
        - {accessible_name: TenantId, value: tenanttenanttenant000198}
        - {accessible_name: ItemCode, value: read}
    required_evidence: [terminal_readback, observe_media, browser_backfill_receipt, backfill_confirmed, backfill_review_media, per_target_dom_readback]
    preconditions: [ROLLBACK_PLANNED]
    required_in_scenarios: [post_change_anomaly]
    review_step: true
  - node_id: REMOVE_SUBMIT
    tool_name: browser_click
    argument_predicates: {receipt_target_name: 确认执行, operation_from_ticket: remove}
    required_evidence: [terminal_readback, observe_media, browser_backfill_receipt, backfill_confirmed, backfill_review_media, accepted_mock_job, command_preview_readback]
    preconditions: [REMOVE_FIELDS]
    required_in_scenarios: [post_change_anomaly]
    review_step: true
  - node_id: REMOVE_WAIT
    tool_name: browser_wait
    argument_predicates: {condition_kind: text_present, terminal_status: SUCCESS, exit_code: 0}
    required_evidence: [terminal_readback, observe_media, browser_backfill_receipt, backfill_confirmed, backfill_review_media, mock_return_code]
    preconditions: [REMOVE_SUBMIT]
    required_in_scenarios: [post_change_anomaly]
    review_step: true
  - node_id: ROLLBACK_GREP
    tool_name: bash
    argument_predicates: {command_from_ticket: true, expected_exit_code: 1, expected_state: absent}
    required_evidence: [terminal_readback, observe_media, browser_backfill_receipt, backfill_confirmed, backfill_review_media, process_return_code, independent_config_readback]
    preconditions: [REMOVE_WAIT]
    required_in_scenarios: [post_change_anomaly]
    review_step: true
  - node_id: ROLLBACK_COMPLETE
    tool_name: browser_click
    argument_predicates: {receipt_target_name: 确认回填, final_state: rolled_back}
    required_evidence: [terminal_readback, observe_media, browser_backfill_receipt, backfill_confirmed, backfill_review_media, final_rollback_state]
    preconditions: [ROLLBACK_GREP]
    required_in_scenarios: [post_change_anomaly]
    review_step: true
