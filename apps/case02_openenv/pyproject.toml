[project]
name = "case02-openenv"
version = "0.1.0"
description = "Run-scoped interactive environment for the HomeMaster coworker demo"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "jinja2>=3.1,<4.0",
  "pillow>=10,<13",
  "pydantic>=2.7,<3.0",
  "pyyaml>=6,<7",
  "uvicorn>=0.30,<1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.2,<10",
  "ruff>=0.6,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
case02_openenv = ["static/*", "templates/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
