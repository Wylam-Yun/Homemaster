<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Service Monitor</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <div><strong>Service Monitor</strong><span class="muted">Live queries</span></div>
    <nav><a href="/ticket/{{ view.run_id }}">Ticket</a><a href="/automation/{{ view.run_id }}">Automation</a></nav>
  </header>
  <main>
    <section class="page-heading compact">
      <p class="eyebrow">Run {{ view.run_id }}</p>
      <h1>Cluster health checks</h1>
    </section>
    <section class="band filters">
      <label>Region<select data-bid="monitor-region" id="monitor-region"><option>{{ view.target.region }}</option></select></label>
      <label>Cluster<select data-bid="monitor-cluster" id="monitor-cluster"><option>{{ view.target.cluster }}</option></select></label>
    </section>
    <section class="query-grid">
      <button data-bid="monitor-query-alarm"><span>Alarm and SLA</span><small>Active alarms and service success</small></button>
      <button data-bid="monitor-query-probe"><span>Probe status</span><small>Synthetic probe availability</small></button>
      <button data-bid="monitor-query-capacity"><span>Cluster capacity</span><small>Failover headroom</small></button>
      <button data-bid="monitor-query-runtime-metrics"><span>Runtime metrics</span><small>Latency, error rate and throughput</small></button>
      <button data-bid="monitor-query-traffic"><span>API traffic</span><small>Gateway request volume</small></button>
    </section>
    <section class="band result-band">
      <div class="result-heading"><h2>Latest result</h2><span id="monitor-stage" class="status pending">waiting</span></div>
      <pre id="monitor-result">Select a query.</pre>
    </section>
  </main>
  <script>window.RUN_PUBLIC = {{ view_json | safe }};</script>
  <script src="/static/monitor.js"></script>
</body>
</html>
