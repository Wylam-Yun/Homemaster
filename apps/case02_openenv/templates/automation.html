<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Automation Console</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <div><strong>Automation Console</strong><span class="muted">Controlled execution</span></div>
    <nav><a href="/ticket/{{ view.run_id }}">Ticket</a><a href="/monitor/{{ view.run_id }}">Monitor</a></nav>
  </header>
  <main>
    <section class="page-heading compact">
      <p class="eyebrow">Run {{ view.run_id }}</p>
      <h1>Submit a change job</h1>
    </section>
    <section class="band form-band">
      <div class="form-grid">
        <label>Script<select data-bid="automation-script" id="automation-script"><option>svc_cfg_cli_runner</option><option>svc_usage_record_fetcher</option></select></label>
        <label>Operation<select data-bid="automation-operation" id="automation-operation"><option>add</option><option>remove</option><option>business_verify</option></select></label>
        <label>TenantId<input data-bid="automation-tenant-id" id="automation-tenant-id" value="{{ view.variables.TenantId }}"></label>
        <label>ItemCode<input data-bid="automation-item-code" id="automation-item-code" value="{{ view.variables.ItemCode }}"></label>
        <label>SpecCode<input data-bid="automation-spec-code" id="automation-spec-code" value="{{ view.variables.SpecCode }}"></label>
        <label>ExtensionName<input data-bid="automation-extension-name" id="automation-extension-name" value="{{ view.variables.ExtensionName }}"></label>
        <label>Resource bucket<input data-bid="automation-resource-bucket" id="automation-resource-bucket" value="{{ view.target.resource_bucket }}"></label>
        <label>Business timestamp<input data-bid="automation-business-timestamp" id="automation-business-timestamp" value="{{ view.target.business_timestamp }}"></label>
        <label>Factor<input data-bid="automation-factor" id="automation-factor" value="0"></label>
      </div>
      <div class="actions"><button data-bid="automation-submit" id="automation-submit">Submit job</button></div>
      <div id="automation-receipt" class="receipt" aria-live="polite">No job submitted.</div>
    </section>
    <section class="band">
      <h2>Run jobs</h2>
      <table><thead><tr><th>Job</th><th>Operation</th><th>Status</th><th>Return code</th></tr></thead><tbody id="jobs-body">
      {% for job in view.jobs %}<tr data-job-id="{{ job.job_id }}"><td>{{ job.job_id }}</td><td>{{ job.operation }}</td><td class="job-status">{{ job.status }}</td><td>{{ job.business_return_code }}</td></tr>{% endfor %}
      </tbody></table>
    </section>
  </main>
  <script>window.RUN_PUBLIC = {{ view_json | safe }};</script>
  <script src="/static/automation.js"></script>
</body>
</html>
