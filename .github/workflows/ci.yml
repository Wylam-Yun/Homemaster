name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true # caches the uv-managed venv keyed on uv.lock

      - name: Install dependencies
        # --frozen: committed uv.lock is the source of truth.
        # --extra dev: pytest/ruff live in the `dev` extra, not the default
        # dependency group, so plain `uv sync` would not install them.
        run: uv sync --frozen --extra dev

      - name: Ruff lint
        # Scoped to src/tests: repo-scope `ruff check .` fails on legacy
        # scripts under plan/, scripts/, workers/ that are not yet lint-clean.
        run: uv run ruff check src tests

      - name: Ruff format
        run: uv run ruff format --check src tests

      - name: Tests
        # Plain pytest: addopts already deselects live_* markers and
        # env-dependent tests self-skip (playwright importorskip, etc.).
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Tests
        working-directory: web
        run: npm test
