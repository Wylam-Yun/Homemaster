<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Browser Controls</title>
  </head>
  <body>
    <label for="tenant">TenantId</label>
    <input id="tenant" name="tenant" required>
    <label for="masked-date-time">Masked date time</label>
    <input id="masked-date-time" name="masked-date-time">


    <label for="region">Region</label>
    <select id="region">
      <option value="cn">China</option>
      <option value="us">United States</option>
    </select>

    <label><input id="subscribe" type="checkbox"> Subscribe</label>
    <button id="duplicate-a">Duplicate</button>
    <button id="duplicate-b">Duplicate</button>
    <button id="apply" onclick="document.getElementById('result').textContent = 'Applied ' + document.getElementById('tenant').value">Apply</button>
    <div id="result" role="status">Idle</div>

    <label for="backfill">Evidence backfill</label>
    <textarea id="backfill"></textarea>
    <div id="backfill-result" role="status">Waiting for image</div>
    <label for="broken-backfill">Broken evidence backfill</label>
    <textarea id="broken-backfill"></textarea>
    <div id="broken-backfill-result" role="status">Waiting for image</div>
    <div style="height: 1600px" aria-hidden="true"></div>
    <button id="offscreen" onclick="this.textContent = 'Offscreen applied'">Offscreen apply</button>
    <button id="delayed-leave" onclick="setTimeout(() => { location.href = new URLSearchParams(location.search).get('target'); }, 100)">Delayed leave</button>
    <script>
      const maskedDateTime = document.getElementById('masked-date-time');
      let maskedDateTimeUsesKeyboard = false;
      maskedDateTime.addEventListener('keydown', () => {
        maskedDateTimeUsesKeyboard = true;
      });
      maskedDateTime.addEventListener('input', () => {
        if (!maskedDateTimeUsesKeyboard) maskedDateTime.value = 'component-normalized';
      });
      document.getElementById('backfill').addEventListener('paste', (event) => {
        const image = Array.from(event.clipboardData.items)
          .map((item) => item.getAsFile())
          .find((file) => file && file.type === 'image/png');
        if (!image) return;
        event.preventDefault();
        const reader = new FileReader();
        reader.onload = () => {
          const preview = document.createElement('img');
          preview.alt = 'Backfilled screenshot';
          preview.src = reader.result;
          document.body.appendChild(preview);
          document.getElementById('backfill-result').textContent =
            `Accepted ${image.type} ${image.size} bytes`;
        };
        reader.readAsDataURL(image);
      });
      document.getElementById('broken-backfill').addEventListener('paste', (event) => {
        event.preventDefault();
        document.getElementById('broken-backfill-result').textContent = 'Screenshot read failed';
      });
    </script>
  </body>
</html>
